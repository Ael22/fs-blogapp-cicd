name: Deployment pipeline

on:
  push: 
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: lint backend
        run: npm run lint
      - name: lint frontend
        run: npm run lint
        working-directory: frontend
  
  backend_tests:
    runs-on: ubuntu-latest
    env: 
      SECRET: ${{ secrets.SECRET }}
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: 
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test

  frontend_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test

  e2e_tests:
    needs: [backend_tests]
    runs-on: ubuntu-latest
    env: 
      SECRET: ${{ secrets.SECRET }}
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      PORT: 3003
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/e2e-tests/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright dependencies
        run: npm ci
        working-directory: frontend/e2e-tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend/e2e-tests
      - name: Start backend
        run: npm run start:test &
      - name: Start frontend
        run: npm run dev &
        working-directory: frontend
      - name: wait for servers
        run: |
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:3003/api/blogs && curl -fs -o /dev/null http://localhost:5173; then
              exit 0
            fi
            sleep 2
          done
          echo "Servers did not start in time"
          exit 1
      - name: Run Playwright tests
        run: npm test -- --project=chromium --project=firefox
        working-directory: frontend/e2e-tests

  deploy:
    needs: [lint, backend_tests, frontend_tests, e2e_tests]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
